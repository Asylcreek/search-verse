<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#082846" />
		<meta name="application-name" content="SearchVerse" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			const preference = localStorage.getItem('searchverse:color-scheme');
			const dark =
				preference === 'dark' ||
				(!preference && window.matchMedia('(prefers-color-scheme: dark)').matches);

			document.documentElement.classList.toggle('dark', dark);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
