networks:
  searchverse:
    name: searchverse
    driver: bridge
  proxy:
    name: proxy
    external: true

services:
  api:
    container_name: searchverse-api
    image: searchverse-api
    build:
      context: .
    environment:
      - NODE_ENV=production
      - PORT=${APP_PORT}
      - API_BIBLE_KEY=${API_BIBLE_KEY}
      - DB_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASS}
      - REDIS_USE_TLS=false
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=${APP_PORT}
    expose:
      - ${APP_PORT}
    depends_on:
      - postgres
      - redis
    networks:
      - searchverse
      - proxy
    restart: unless-stopped

  postgres:
    container_name: searchverse-postgres
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASS}
    volumes:
      - ~/postgres/search-verse-prod:/var/lib/postgresql/data
    networks:
      - searchverse
    restart: unless-stopped

  redis:
    container_name: searchverse-redis
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASS} --appendonly yes
    volumes:
      - ~/redis/search-verse-prod:/data
    networks:
      - searchverse
    restart: unless-stopped
